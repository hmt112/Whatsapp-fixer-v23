name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install deps
        run: npm install
      - name: Setup Android
        run: |
          npx react-native@0.73.6 init Temp --version 0.73.6 --skip-install
          cp -r Temp/android ./
          rm -rf Temp
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Whatsapp-Fixer-APK
          path: android/app/build/outputs/apk/release/app-release.apk
