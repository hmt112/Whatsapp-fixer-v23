name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build
        run: |
          npx react-native@0.73.6 init FixerApp --version 0.73.6
          cp App.tsx FixerApp/App.tsx
          cd FixerApp
          npm install
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Whatsapp-Fixer-APK
          path: FixerApp/android/app/build/outputs/apk/release/app-release.apk
